name: SpoolmanSync (Fork)
version: "1.5.3"
slug: spoolmansync-ha-addon
description: >-
  Fork of SpoolmanSync — automatic filament tracking for Bambu Lab and Creality with Spoolman.
  Repo https://github.com/ceraetes/SpoolmanSync (upstream gibz104/SpoolmanSync).
url: https://github.com/ceraetes/SpoolmanSync
# Omit `image` so Supervisor builds from `Dockerfile` when this add-on is installed from Git.
# (A fixed image would always pull upstream, ignoring fork/local changes.)
# Prebuilt installs: uncomment and set registry + tag that matches `version` below.
# image: ghcr.io/gibz104/spoolmansync-addon
arch:
  - aarch64
  - amd64

# Ingress (web UI in HA sidebar)
ingress: true
ingress_port: 0
panel_icon: mdi:target
panel_title: SpoolmanSync (Fork)

# API access for connecting to HA
homeassistant_api: true
hassio_api: true
auth_api: true

# Map HA config directory so addon can write automations.yaml and configuration.yaml
map:
  - config:rw

# User-configurable options (all optional, configurable from the UI)
options:
  port: 3000
schema:
  spoolman_url: url?
  port: "int(1024,65535)?"

# Use host network so the add-on can reach services on Tailscale, VPNs, etc.
host_network: true

# Startup configuration
startup: application
boot: auto
